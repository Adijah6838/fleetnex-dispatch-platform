<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEETNEX - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">FLEETNEX</div>
        <ul class="nav-links">
            <li class="active">Dashboard</li>
            <li>Deliveries</li>
            <li>Fleet Manager</li>
            <li>Dispatch Center</li>
            <li>Analytics</li>
        </ul>
        <div style="margin-top: auto; padding: 20px;">
            <button class="btn" style="background: var(--danger);" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Live Operations Overview</h2>
            <div id="userDisplay" style="font-weight: bold; color: var(--text-muted);"></div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Deliveries</h3>
                <div class="value primary" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="value" id="stat-pending">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value success" id="stat-completed">0</div>
            </div>
            <div class="stat-card">
                <h3>Failed</h3>
                <div class="value danger" id="stat-failed">0</div>
            </div>
            <div class="stat-card">
                <h3>Available Drivers</h3>
                <div class="value primary" id="stat-drivers">0</div>
            </div>
            <div class="stat-card">
                <h3>Available Vehicles</h3>
                <div class="value primary" id="stat-vehicles">0</div>
            </div>
        </div>

        <!-- Charts Area -->
        <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
            <div class="stat-card">
                <h3 style="margin-bottom: 20px;">Deliveries by Status</h3>
                <canvas id="statusChart" height="80"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. Check Authentication
        const token = localStorage.getItem('fleetnex_token');
        const user = JSON.parse(localStorage.getItem('fleetnex_user'));

        if (!token) {
            window.location.href = '/'; // Redirect to login if no token
        } else if (user) {
            document.getElementById('userDisplay').innerText = `${user.username} (${user.role})`;
        }

        // 2. Fetch Data from API
        async function fetchDashboardData() {
            const headers = { "Authorization": `Bearer ${token}` };

            try {
                // Fetch Overview Stats
                const overviewRes = await fetch('/api/analytics/overview', { headers });
                const overviewData = await overviewRes.json();

                if (overviewData.success) {
                    const d = overviewData.data;
                    document.getElementById('stat-total').innerText = d.total_deliveries;
                    document.getElementById('stat-pending').innerText = d.pending_deliveries;
                    document.getElementById('stat-completed').innerText = d.completed_deliveries;
                    document.getElementById('stat-failed').innerText = d.failed_deliveries;
                    document.getElementById('stat-drivers').innerText = d.available_drivers;
                    document.getElementById('stat-vehicles').innerText = d.available_vehicles;
                }

                // Fetch Chart Data
                const chartRes = await fetch('/api/analytics/deliveries', { headers });
                const chartData = await chartRes.json();

                if (chartData.success) {
                    renderChart(chartData.data);
                }
            } catch (err) {
                console.error("Dashboard fetch error:", err);
            }
        }

        // 3. Render Chart.js
        function renderChart(data) {
            const labels = data.map(item => item.status);
            const counts = data.map(item => item.count);

            const ctx = document.getElementById('statusChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Number of Deliveries',
                        data: counts,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        // 4. Logout
        function logout() {
            localStorage.removeItem('fleetnex_token');
            localStorage.removeItem('fleetnex_user');
            window.location.href = '/';
        }

        // Run on load
        fetchDashboardData();
    </script>
</body>
</html>
